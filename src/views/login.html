<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>登录 - Server X Static</title>
    <style>
      :root {
        --bg: #f6f8fb;
        --panel: #ffffff;
        --panel-strong: #f8fafc;
        --border: #e2e8f0;
        --border-active: rgba(22, 163, 74, 0.38);
        --text: #0f172a;
        --muted: #64748b;
        --green: #22c55e;
        --red: #ef4444;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        color: var(--text);
        background:
          radial-gradient(
            circle at top left,
            rgba(34, 197, 94, 0.12),
            transparent 32rem
          ),
          radial-gradient(
            circle at top right,
            rgba(59, 130, 246, 0.1),
            transparent 28rem
          ),
          linear-gradient(180deg, #ffffff 0%, var(--bg) 42%);
      }

      .shell {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        width: min(420px, calc(100% - 32px));
        margin: 0 auto;
        padding: 32px 0;
      }

      .login-card {
        width: 100%;
        padding: 28px 26px 24px;
        border: 1px solid var(--border);
        border-radius: 22px;
        background: linear-gradient(145deg, var(--panel), var(--panel-strong));
        box-shadow: 0 12px 28px rgba(15, 23, 42, 0.08);
      }

      .login-title {
        margin: 0 0 6px;
        font-size: 22px;
        letter-spacing: -0.02em;
      }

      .login-hint {
        margin: 0 0 24px;
        color: var(--muted);
        font-size: 13px;
      }

      .field {
        margin-bottom: 14px;
      }

      .field label {
        display: block;
        margin-bottom: 6px;
        color: #475569;
        font-size: 12px;
        font-weight: 700;
      }

      .field input {
        width: 100%;
        min-height: 40px;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 0 12px;
        color: var(--text);
        background: #f8fafc;
        font-size: 14px;
        outline: none;
      }

      .field input:focus {
        border-color: rgba(37, 99, 235, 0.28);
        background: #ffffff;
        box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.08);
      }

      .submit-button {
        width: 100%;
        margin-top: 8px;
        border: 1px solid rgba(34, 197, 94, 0.68);
        border-radius: 12px;
        padding: 11px 14px;
        color: #ffffff;
        background: var(--green);
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.12);
      }

      .submit-button:hover {
        filter: brightness(0.97);
      }

      .error-message {
        margin: 0 0 14px;
        padding: 10px 12px;
        border: 1px solid rgba(239, 68, 68, 0.45);
        border-radius: 12px;
        color: #b91c1c;
        background: rgba(254, 242, 242, 0.9);
        font-size: 13px;
      }

      @media (max-width: 480px) {
        .shell {
          width: min(100% - 24px, 420px);
          padding: 24px 0 40px;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <form class="login-card" method="post" action="/admin/login">
        <h1 class="login-title">管理员登录</h1>
        <div class="error-message" id="errorMessage" hidden></div>

        <div class="field">
          <label for="username">账号</label>
          <input
            id="username"
            name="username"
            type="text"
            autocomplete="username"
            required
          />
        </div>

        <div class="field">
          <label for="password">密码</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
          />
        </div>

        <button class="submit-button" type="submit">登录</button>
      </form>
    </div>

    <script>
      const params = new URLSearchParams(window.location.search);
      const errorMessage = document.querySelector("#errorMessage");

      if (params.get("error") === "1") {
        errorMessage.hidden = false;
        errorMessage.textContent = "账号或密码错误，请重试。";
      }
    </script>
  </body>
</html>
