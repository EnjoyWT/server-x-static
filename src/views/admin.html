<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>项目管理 - Server X Static</title>
    <style>
      :root {
        --bg: #f6f8fb;
        --panel: #ffffff;
        --panel-strong: #f8fafc;
        --border: #e2e8f0;
        --border-active: rgba(22, 163, 74, 0.38);
        --text: #0f172a;
        --muted: #64748b;
        --green: #22c55e;
        --gray: #cbd5e1;
        --red: #ef4444;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        color: var(--text);
        background:
          radial-gradient(
            circle at top left,
            rgba(34, 197, 94, 0.12),
            transparent 32rem
          ),
          radial-gradient(
            circle at top right,
            rgba(59, 130, 246, 0.1),
            transparent 28rem
          ),
          linear-gradient(180deg, #ffffff 0%, var(--bg) 42%);
      }

      main {
        width: min(1180px, calc(100% - 32px));
        margin: 0 auto;
        padding: 24px 0 56px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        margin-bottom: 48px;
      }

      .brand {
        margin: 0;
        color: #0f172a;
        font-size: 25px;
        font-weight: 850;
        letter-spacing: 0.08em;
        line-height: 1;
      }

      .stats {
        display: inline-flex;
        align-items: center;
        gap: 14px;
        color: var(--muted);
        font-size: 12px;
        white-space: nowrap;
      }

      .stat-item {
        display: inline-flex;
        align-items: baseline;
        gap: 5px;
      }

      .stat-item strong {
        color: #334155;
        font-size: 14px;
        line-height: 1;
        font-weight: 750;
      }

      .toolbar {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        max-width: 100%;
        margin-bottom: 16px;
        padding: 6px;
        border: 1px solid var(--border);
        border-radius: 13px;
        background: rgba(255, 255, 255, 0.78);
        box-shadow: 0 6px 16px rgba(15, 23, 42, 0.045);
      }

      .search-input {
        width: 260px;
        max-width: 42vw;
        min-height: 34px;
        border: 1px solid transparent;
        border-radius: 10px;
        padding: 0 10px;
        color: var(--text);
        background: #f8fafc;
        font-size: 13px;
        outline: none;
      }

      .search-input:focus {
        border-color: rgba(37, 99, 235, 0.28);
        background: #ffffff;
        box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.08);
      }

      .refresh-button {
        border: 1px solid rgba(226, 232, 240, 0.62);
        border-radius: 10px;
        padding: 7px 11px;
        color: #475569;
        background: rgba(255, 255, 255, 0.72);
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
      }

      .refresh-button:hover {
        border-color: rgba(203, 213, 225, 0.72);
        background: rgba(248, 250, 252, 0.86);
      }

      .publish-button {
        border: 0.5px solid rgba(34, 197, 94, 0.45);
        border-radius: 10px;
        padding: 7px 12px;
        color: #15803d;
        background: rgba(240, 253, 244, 0.92);
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
      }

      .publish-button:hover {
        border-color: rgba(34, 197, 94, 0.68);
        background: rgba(220, 252, 231, 0.96);
      }

      .logout-button {
        border: 1px solid rgba(226, 232, 240, 0.62);
        border-radius: 10px;
        padding: 7px 11px;
        color: #64748b;
        background: rgba(255, 255, 255, 0.72);
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
      }

      .logout-button:hover {
        border-color: rgba(203, 213, 225, 0.72);
        color: #475569;
        background: rgba(248, 250, 252, 0.86);
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(210px, 260px));
        justify-content: start;
        gap: 12px;
      }

      .card {
        position: relative;
        min-height: 108px;
        padding: 13px 14px;
        border: 1px solid var(--border);
        border-radius: 18px;
        background: linear-gradient(145deg, var(--panel), var(--panel-strong));
        box-shadow: 0 8px 22px rgba(15, 23, 42, 0.06);
        overflow: hidden;
      }

      .card.enabled {
        border-color: var(--border-active);
      }

      .card.disabled {
        opacity: 0.86;
      }

      .card-top,
      .card-bottom {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 14px;
      }

      .card-top {
        margin-bottom: 12px;
      }

      .card-bottom {
        align-items: center;
        gap: 12px;
      }

      .project-name {
        margin: 0;
        font-size: 17px;
        line-height: 1.18;
        letter-spacing: -0.025em;
        word-break: break-word;
      }

      .path-row {
        min-width: 0;
        display: inline-flex;
        align-items: center;
        gap: 7px;
      }

      .project-path {
        min-width: 0;
        color: #2563eb;
        font-family:
          ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
          "Liberation Mono", monospace;
        font-size: 13px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .copy-button {
        flex: 0 0 auto;
        border: 1px solid #dbeafe;
        border-radius: 999px;
        padding: 4px 8px;
        color: #2563eb;
        background: #eff6ff;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
      }

      .status-badge {
        flex: 0 0 auto;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--muted);
        font-size: 13px;
      }

      .status-badge::before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #94a3b8;
      }

      .status-badge.enabled-text {
        color: #15803d;
      }

      .status-badge.enabled-text::before {
        background: var(--green);
      }

      .switch {
        position: relative;
        display: inline-flex;
        flex: 0 0 auto;
        width: 38px;
        height: 22px;
        cursor: pointer;
      }

      .switch input {
        position: absolute;
        opacity: 0;
        width: 0;
        height: 0;
      }

      .slider {
        position: absolute;
        inset: 0;
        border: 1px solid rgba(148, 163, 184, 0.45);
        border-radius: 999px;
        background: var(--gray);
        transition: 180ms ease;
      }

      .slider::after {
        content: "";
        position: absolute;
        width: 16px;
        height: 16px;
        left: 2px;
        top: 2px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 3px 8px rgba(15, 23, 42, 0.22);
        transition: 180ms ease;
      }

      .switch input:checked + .slider {
        border-color: rgba(34, 197, 94, 0.68);
        background: var(--green);
        box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.12);
      }

      .switch input:checked + .slider::after {
        transform: translateX(16px);
      }

      .switch input:disabled + .slider {
        cursor: wait;
        filter: saturate(0.55);
      }

      .empty,
      .error {
        grid-column: 1 / -1;
        padding: 32px;
        border: 1px dashed var(--border);
        border-radius: 24px;
        color: var(--muted);
        background: rgba(255, 255, 255, 0.72);
        text-align: center;
      }

      .error {
        border-color: rgba(239, 68, 68, 0.45);
        color: #b91c1c;
      }

      .card.highlight {
        animation: card-highlight 1.6s ease;
      }

      @keyframes card-highlight {
        0%,
        100% {
          box-shadow: 0 8px 22px rgba(15, 23, 42, 0.06);
        }

        35% {
          box-shadow:
            0 0 0 4px rgba(34, 197, 94, 0.18),
            0 8px 22px rgba(15, 23, 42, 0.06);
        }
      }

      .modal-backdrop {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: rgba(15, 23, 42, 0.42);
        z-index: 1000;
      }

      .modal-backdrop.is-open {
        display: flex;
      }

      .modal {
        width: min(480px, 100%);
        border: 1px solid var(--border);
        border-radius: 18px;
        background: linear-gradient(145deg, var(--panel), var(--panel-strong));
        box-shadow: 0 18px 48px rgba(15, 23, 42, 0.18);
        overflow: hidden;
      }

      .modal-header,
      .modal-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 16px 18px;
      }

      .modal-header {
        border-bottom: 1px solid rgba(226, 232, 240, 0.72);
      }

      .modal-title {
        margin: 0;
        font-size: 17px;
        font-weight: 800;
      }

      .modal-close {
        border: none;
        border-radius: 8px;
        padding: 6px 8px;
        color: #64748b;
        background: transparent;
        font-size: 18px;
        line-height: 1;
        cursor: pointer;
      }

      .modal-close:hover {
        color: #334155;
        background: rgba(248, 250, 252, 0.92);
      }

      .modal-body {
        padding: 18px;
      }

      .dropzone {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        min-height: 120px;
        padding: 18px;
        border: 1px dashed rgba(148, 163, 184, 0.72);
        border-radius: 14px;
        color: var(--muted);
        background: rgba(248, 250, 252, 0.72);
        text-align: center;
        cursor: pointer;
        transition: 160ms ease;
        margin-top: 16px;
      }

      .dropzone:hover,
      .dropzone.is-dragover {
        border-color: var(--border-active);
        background: rgba(240, 253, 244, 0.72);
        color: #15803d;
      }

      .dropzone.has-file {
        border-style: solid;
        border-color: rgba(37, 99, 235, 0.28);
        background: rgba(239, 246, 255, 0.72);
        color: #1d4ed8;
      }

      .dropzone-title {
        font-size: 14px;
        font-weight: 700;
        color: inherit;
      }

      .dropzone-meta {
        font-size: 12px;
        color: #64748b;
      }

      .field-label {
        display: block;
        margin-bottom: 6px;
        color: #334155;
        font-size: 13px;
        font-weight: 700;
      }

      .field-input {
        width: 100%;
        min-height: 38px;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 0 12px;
        color: var(--text);
        background: #ffffff;
        font-size: 14px;
        outline: none;
      }

      .field-input:focus {
        border-color: rgba(37, 99, 235, 0.28);
        box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.08);
      }

      .field-input.is-invalid {
        border-color: rgba(239, 68, 68, 0.55);
      }

      .field-hint,
      .field-warning,
      .field-error {
        margin: 6px 0 0;
        font-size: 12px;
      }

      .field-hint {
        color: var(--muted);
      }

      .field-warning {
        color: #b45309;
      }

      .field-error {
        color: #b91c1c;
      }

      .checkbox-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 14px;
        color: #334155;
        font-size: 13px;
      }

      .modal-footer {
        border-top: 1px solid rgba(226, 232, 240, 0.72);
        justify-content: flex-end;
      }

      .modal-button {
        border: 1px solid rgba(226, 232, 240, 0.72);
        border-radius: 10px;
        padding: 8px 14px;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
      }

      .modal-button.secondary {
        color: #475569;
        background: rgba(255, 255, 255, 0.92);
      }

      .modal-button.primary {
        border-color: rgba(34, 197, 94, 0.55);
        color: #ffffff;
        background: var(--green);
      }

      .modal-button:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }

      .upload-progress {
        display: none;
        margin-top: 14px;
      }

      .upload-progress.is-visible {
        display: block;
      }

      .upload-progress-bar {
        height: 6px;
        border-radius: 999px;
        overflow: hidden;
        background: rgba(226, 232, 240, 0.72);
      }

      .upload-progress-bar > span {
        display: block;
        width: 36%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #22c55e, #16a34a);
        animation: upload-indeterminate 1s ease-in-out infinite alternate;
      }

      @keyframes upload-indeterminate {
        from {
          transform: translateX(-10%);
        }

        to {
          transform: translateX(220%);
        }
      }

      .upload-progress-text {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 12px;
      }

      @media (max-width: 720px) {
        main {
          width: min(100% - 24px, 1120px);
          padding-top: 28px;
        }

        .topbar,
        .toolbar {
          display: flex;
          align-items: stretch;
          flex-direction: column;
        }

        .stats {
          justify-content: space-between;
        }

        .search-input {
          width: 100%;
          max-width: none;
        }

        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="topbar">
        <p class="brand">SERVER-X-STATIC</p>
        <div class="stats" aria-label="项目统计">
          <span class="stat-item">全部 <strong id="totalCount">0</strong></span>
          <span class="stat-item"
            >启用 <strong id="enabledCount">0</strong></span
          >
          <span class="stat-item"
            >关闭 <strong id="disabledCount">0</strong></span
          >
          <form method="post" action="/admin/logout">
            <button class="logout-button" type="submit">退出</button>
          </form>
        </div>
      </section>

      <section class="toolbar">
        <input
          class="search-input"
          id="searchInput"
          type="search"
          placeholder="搜索项目名或路径"
          autocomplete="off"
        />
        <button class="refresh-button" type="button" id="refreshButton">
          刷新
        </button>
      </section>

      <button class="publish-button" type="button" id="openPublishModal">
        + 发布项目
      </button>

      <section class="grid" id="projectGrid" aria-live="polite"></section>
    </main>

    <div class="modal-backdrop" id="publishModal" aria-hidden="true">
      <div
        class="modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="publishModalTitle"
      >
        <div class="modal-header">
          <h2 class="modal-title" id="publishModalTitle">发布项目</h2>
          <button
            class="modal-close"
            type="button"
            id="closePublishModal"
            aria-label="关闭"
          >
            ×
          </button>
        </div>
        <form id="publishForm">
          <div class="modal-body">
            <div class="field">
              <label class="field-label" for="projectNameInput">项目名</label>
              <input
                class="field-input"
                id="projectNameInput"
                name="name"
                type="text"
                placeholder="例如 voteme"
                autocomplete="off"
                required
              />
              <p class="field-hint" id="projectPathHint">
                访问路径 /dyn/项目名/
              </p>
              <p class="field-warning" id="overwriteWarning" hidden>
                将覆盖已有项目，上传后会替换现有文件。
              </p>
              <p class="field-error" id="publishError" hidden></p>
            </div>

            <label class="checkbox-row">
              <input
                id="enableOnPublish"
                name="enabled"
                type="checkbox"
                checked
              />
              发布后立即启用
            </label>

            <div class="upload-progress" id="uploadProgress">
              <div class="upload-progress-bar"><span></span></div>
              <p class="upload-progress-text">正在发布，请稍候…</p>
            </div>

            <input
              id="zipInput"
              type="file"
              accept=".zip,application/zip"
              hidden
            />
            <div class="dropzone" id="dropzone">
              <p class="dropzone-title">拖入 ZIP 文件，或点击选择</p>
              <p class="dropzone-meta">
                根目录需包含 index.html，单包最大 50MB
              </p>
            </div>
          </div>
          <div class="modal-footer">
            <button
              class="modal-button secondary"
              type="button"
              id="cancelPublish"
            >
              取消
            </button>
            <button
              class="modal-button primary"
              type="submit"
              id="submitPublish"
              disabled
            >
              发布
            </button>
          </div>
        </form>
      </div>
    </div>

    <script>
      const grid = document.querySelector("#projectGrid");
      const refreshButton = document.querySelector("#refreshButton");
      const searchInput = document.querySelector("#searchInput");
      const openPublishModalButton =
        document.querySelector("#openPublishModal");
      const publishModal = document.querySelector("#publishModal");
      const closePublishModalButton =
        document.querySelector("#closePublishModal");
      const cancelPublishButton = document.querySelector("#cancelPublish");
      const publishForm = document.querySelector("#publishForm");
      const dropzone = document.querySelector("#dropzone");
      const zipInput = document.querySelector("#zipInput");
      const projectNameInput = document.querySelector("#projectNameInput");
      const projectPathHint = document.querySelector("#projectPathHint");
      const overwriteWarning = document.querySelector("#overwriteWarning");
      const publishError = document.querySelector("#publishError");
      const enableOnPublish = document.querySelector("#enableOnPublish");
      const submitPublishButton = document.querySelector("#submitPublish");
      const uploadProgress = document.querySelector("#uploadProgress");
      const totalCount = document.querySelector("#totalCount");
      const enabledCountEl = document.querySelector("#enabledCount");
      const disabledCount = document.querySelector("#disabledCount");
      const PROJECT_NAME_PATTERN = /^[a-zA-Z0-9][a-zA-Z0-9_-]*$/;
      let allProjects = [];
      let selectedZipFile = null;
      let isPublishing = false;
      let highlightProjectName = "";

      function escapeHtml(value) {
        return String(value).replace(
          /[&<>'"]/g,
          (char) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              "'": "&#39;",
              '"': "&quot;",
            })[char],
        );
      }

      function updateStats(projects = allProjects) {
        const total = projects.length;
        const enabled = projects.filter((project) => project.enabled).length;
        totalCount.textContent = total;
        enabledCountEl.textContent = enabled;
        disabledCount.textContent = total - enabled;
      }

      function getFilteredProjects() {
        const keyword = searchInput.value.trim().toLowerCase();
        if (!keyword) return allProjects;
        return allProjects.filter((project) => {
          return (
            project.name.toLowerCase().includes(keyword) ||
            project.path.toLowerCase().includes(keyword)
          );
        });
      }

      function renderProjects(projects) {
        updateStats(allProjects);

        if (allProjects.length === 0) {
          grid.innerHTML =
            '<div class="empty">暂无项目。点击「发布项目」上传 ZIP，或把项目文件夹放进 <code>dynamics/</code> 后刷新。</div>';
          return;
        }

        if (projects.length === 0) {
          grid.innerHTML = '<div class="empty">没有匹配的项目。</div>';
          return;
        }

        grid.innerHTML = projects
          .map((project) => {
            const statusClass = project.enabled ? "enabled" : "disabled";
            const textClass = project.enabled
              ? "enabled-text"
              : "disabled-text";
            const statusText = project.enabled ? "已启用" : "已关闭";

            const highlightClass =
              project.name === highlightProjectName ? " highlight" : "";

            return `
              <article class="card ${statusClass}${highlightClass}" data-project-card="${escapeHtml(project.name)}">
                <div class="card-top">
                  <h2 class="project-name">${escapeHtml(project.name)}</h2>
                  <label class="switch" aria-label="切换 ${escapeHtml(project.name)} 启用状态">
                    <input type="checkbox" data-project-toggle="${escapeHtml(project.name)}" ${project.enabled ? "checked" : ""}>
                    <span class="slider"></span>
                  </label>
                </div>
                <div class="card-bottom">
                  <div class="path-row">
                    <a class="project-path" href="${escapeHtml(project.path)}" target="_blank" rel="noreferrer">${escapeHtml(project.path)}</a>
                    <button class="copy-button" type="button" data-copy-path="${escapeHtml(project.path)}">复制</button>
                  </div>
                  <span class="status-badge ${textClass}">${statusText}</span>
                </div>
              </article>
            `;
          })
          .join("");
      }

      function redirectToLogin() {
        window.location.href = "/admin/login";
      }

      function formatFileSize(bytes) {
        if (bytes < 1024) return `${bytes} B`;
        if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
        return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
      }

      function deriveProjectNameFromFile(file) {
        const baseName = file.name.replace(/\.zip$/i, "");
        return PROJECT_NAME_PATTERN.test(baseName) ? baseName : "";
      }

      function isValidProjectName(name) {
        return PROJECT_NAME_PATTERN.test(name) && name.length > 0;
      }

      function projectExistsByName(name) {
        return allProjects.some((project) => project.name === name);
      }

      function setPublishError(message) {
        if (!message) {
          publishError.hidden = true;
          publishError.textContent = "";
          return;
        }

        publishError.hidden = false;
        publishError.textContent = message;
      }

      function updatePublishFormState() {
        const projectName = projectNameInput.value.trim();
        const nameValid = isValidProjectName(projectName);

        projectNameInput.classList.toggle(
          "is-invalid",
          projectName.length > 0 && !nameValid,
        );
        projectPathHint.textContent = nameValid
          ? `访问路径 /dyn/${encodeURIComponent(projectName)}/`
          : "项目名仅支持字母、数字、连字符和下划线";
        overwriteWarning.hidden = !(
          nameValid && projectExistsByName(projectName)
        );
        submitPublishButton.disabled =
          isPublishing || !selectedZipFile || !nameValid;
      }

      function renderSelectedFile() {
        if (!selectedZipFile) {
          dropzone.classList.remove("has-file");
          dropzone.innerHTML = `
            <p class="dropzone-title">拖入 ZIP 文件，或点击选择</p>
            <p class="dropzone-meta">根目录需包含 index.html，单包最大 50MB</p>
          `;
          return;
        }

        dropzone.classList.add("has-file");
        dropzone.innerHTML = `
          <p class="dropzone-title">${escapeHtml(selectedZipFile.name)}</p>
          <p class="dropzone-meta">${formatFileSize(selectedZipFile.size)} · 点击可更换文件</p>
        `;
      }

      function setSelectedZipFile(file) {
        if (!file) {
          selectedZipFile = null;
          renderSelectedFile();
          updatePublishFormState();
          return;
        }

        if (!/\.zip$/i.test(file.name)) {
          setPublishError("仅支持 .zip 文件。");
          return;
        }

        selectedZipFile = file;
        setPublishError("");

        if (!projectNameInput.value.trim()) {
          const derivedName = deriveProjectNameFromFile(file);
          if (derivedName) {
            projectNameInput.value = derivedName;
          }
        }

        renderSelectedFile();
        updatePublishFormState();
      }

      function resetPublishForm() {
        selectedZipFile = null;
        zipInput.value = "";
        projectNameInput.value = "";
        enableOnPublish.checked = true;
        setPublishError("");
        uploadProgress.classList.remove("is-visible");
        renderSelectedFile();
        updatePublishFormState();
      }

      function openPublishModal() {
        resetPublishForm();
        publishModal.classList.add("is-open");
        publishModal.setAttribute("aria-hidden", "false");
        projectNameInput.focus();
      }

      function closePublishModal(force = false) {
        if (isPublishing && !force) {
          return;
        }

        publishModal.classList.remove("is-open");
        publishModal.setAttribute("aria-hidden", "true");
        if (!isPublishing) {
          resetPublishForm();
        }
      }

      function setPublishingState(active) {
        isPublishing = active;
        submitPublishButton.disabled =
          active ||
          !selectedZipFile ||
          !isValidProjectName(projectNameInput.value.trim());
        submitPublishButton.textContent = active ? "发布中…" : "发布";
        cancelPublishButton.disabled = active;
        closePublishModalButton.disabled = active;
        openPublishModalButton.disabled = active;
        uploadProgress.classList.toggle("is-visible", active);
        updatePublishFormState();
      }

      async function submitPublish(event) {
        event.preventDefault();

        const projectName = projectNameInput.value.trim();
        if (!selectedZipFile || !isValidProjectName(projectName)) {
          updatePublishFormState();
          return;
        }

        if (projectExistsByName(projectName)) {
          const confirmed = window.confirm(
            `项目「${projectName}」已存在，上传将完全替换现有文件，是否继续？`,
          );
          if (!confirmed) {
            return;
          }
        }

        setPublishingState(true);
        setPublishError("");

        const formData = new FormData();
        formData.append("file", selectedZipFile);
        formData.append("name", projectName);
        formData.append("enabled", enableOnPublish.checked ? "true" : "false");

        try {
          const response = await fetch("/admin/projects/upload", {
            method: "POST",
            body: formData,
          });
          const payload = await response.json();

          if (response.status === 401) {
            redirectToLogin();
            return;
          }

          if (!response.ok || !payload.success) {
            throw new Error(payload.message || "发布失败");
          }

          highlightProjectName = projectName;
          closePublishModal(true);
          resetPublishForm();
          await loadProjects();
          window.setTimeout(() => {
            highlightProjectName = "";
          }, 1800);
        } catch (error) {
          setPublishError(error.message);
        } finally {
          setPublishingState(false);
        }
      }

      async function loadProjects() {
        grid.innerHTML = "";

        try {
          const response = await fetch("/admin/projects");
          const payload = await response.json();

          if (response.status === 401) {
            redirectToLogin();
            return;
          }

          if (!response.ok || !payload.success) {
            throw new Error(payload.message || "读取项目失败");
          }

          allProjects = payload.data.projects || [];
          renderProjects(getFilteredProjects());
        } catch (error) {
          grid.innerHTML = `<div class="error">${escapeHtml(error.message)}</div>`;
        }
      }

      function setCardState(card, enabled) {
        card.classList.toggle("enabled", enabled);
        card.classList.toggle("disabled", !enabled);

        const statusText = card.querySelector(".status-badge");
        if (statusText) {
          statusText.textContent = enabled ? "已启用" : "已关闭";
          statusText.classList.toggle("enabled-text", enabled);
          statusText.classList.toggle("disabled-text", !enabled);
        }
      }

      async function updateProject(name, enabled, input) {
        const project = allProjects.find((item) => item.name === name);
        const card = grid.querySelector(
          `[data-project-card="${CSS.escape(name)}"]`,
        );
        input.disabled = true;

        if (project) project.enabled = enabled;
        if (card) setCardState(card, enabled);
        updateStats(allProjects);

        try {
          const response = await fetch(
            `/admin/projects/${encodeURIComponent(name)}`,
            {
              method: "PATCH",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ enabled }),
            },
          );
          const payload = await response.json();

          if (response.status === 401) {
            redirectToLogin();
            return;
          }

          if (!response.ok || !payload.success) {
            throw new Error(payload.message || "更新失败");
          }
        } catch (error) {
          input.checked = !enabled;
          if (project) project.enabled = !enabled;
          if (card) setCardState(card, !enabled);
          updateStats(allProjects);
          alert(error.message);
        } finally {
          input.disabled = false;
        }
      }

      grid.addEventListener("change", (event) => {
        const input = event.target.closest("[data-project-toggle]");
        if (!input) return;
        updateProject(input.dataset.projectToggle, input.checked, input);
      });

      grid.addEventListener("click", async (event) => {
        const button = event.target.closest("[data-copy-path]");
        if (!button) return;

        try {
          await navigator.clipboard.writeText(button.dataset.copyPath);
          button.textContent = "已复制";
          window.setTimeout(() => {
            button.textContent = "复制";
          }, 1200);
        } catch (error) {
          alert("复制失败");
        }
      });

      searchInput.addEventListener("input", () => {
        renderProjects(getFilteredProjects());
      });

      refreshButton.addEventListener("click", loadProjects);
      openPublishModalButton.addEventListener("click", openPublishModal);
      closePublishModalButton.addEventListener("click", () =>
        closePublishModal(),
      );
      cancelPublishButton.addEventListener("click", () => closePublishModal());
      publishModal.addEventListener("click", (event) => {
        if (event.target === publishModal) {
          closePublishModal();
        }
      });
      publishForm.addEventListener("submit", submitPublish);
      projectNameInput.addEventListener("input", updatePublishFormState);
      dropzone.addEventListener("click", () => zipInput.click());
      zipInput.addEventListener("change", (event) => {
        const file = event.target.files?.[0];
        if (file) {
          setSelectedZipFile(file);
        }
      });

      ["dragenter", "dragover"].forEach((eventName) => {
        dropzone.addEventListener(eventName, (event) => {
          event.preventDefault();
          dropzone.classList.add("is-dragover");
        });
      });

      ["dragleave", "drop"].forEach((eventName) => {
        dropzone.addEventListener(eventName, (event) => {
          event.preventDefault();
          dropzone.classList.remove("is-dragover");
        });
      });

      dropzone.addEventListener("drop", (event) => {
        const file = event.dataTransfer?.files?.[0];
        if (file) {
          setSelectedZipFile(file);
        }
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          closePublishModal();
        }
      });

      loadProjects();
    </script>
  </body>
</html>
